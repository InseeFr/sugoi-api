name: Sugoi API Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version of the release"
        required: true

jobs:
  pre-release:
    name: pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git config --global user.name "Insee - Team sugoi"
          git config --global user.email "sugoi@insee.fr"
          git clone https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{github.repository}}.git
          cd sugoi-api/
          git checkout ${{ github.ref_name }}
          git fetch --tags
          git checkout -b release-$VERSION
          mvn -B versions:set -DnewVersion=$VERSION  -DgenerateBackupPoms=false
          echo -e "# $VERSION \n\n" >> changelog.tmp
          git log --pretty=format:"- %s" `git tag --sort=-committerdate | head -1`...@ | grep -v [REL] >> changelog.tmp
          echo -e "\n\n" >> changelog.tmp
          cat CHANGELOG.md >> changelog.tmp
          mv changelog.tmp CHANGELOG.md
          mvn -B spotless:apply
          git add .
          git commit -sm "[REL] :rocket: release version $VERSION"
          git push origin release-$VERSION -f
          gh pr create --title "[REL] :rocket: Release version $VERSION" --body "[REL] :rocket: prepare new version $VERSION"

  release:
    name: release
    runs-on: ubuntu-latest
    needs: pre-release
    steps:
      - name: Clone Deployments repo
        uses: actions/checkout@v2
        with:
          repository: ${{github.repository}}
          ref: release-${{ github.event.inputs.version }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build with Maven
        run: |
          mvn -B clean install 
          cd sugoi-api-distribution/sugoi-api-distribution-jar/
          mvn -B assembly:single

      - name: Create a release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "release-${VERSION}" \
            --title "V${VERSION}" \
            --notes "[CHANGELOG](https://github.com/${{ github.repository }}/blob/${VERSION}/CHANGELOG.md)" \
            ./sugoi-api-distribution/sugoi-api-distribution-jar/target/sugoi-api.zip \
            ./sugoi-api-distribution/sugoi-api-distribution-war/target/sugoi-api.war

  after-release:
    name: after-release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          git config --global user.name "Insee - Team sugoi"
          git config --global user.email "sugoi@insee.fr"
          git clone https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{github.repository}}.git
          cd sugoi-api/
          git checkout release-${{ github.event.inputs.version }}
          git pull
          old_version=${{ github.event.inputs.version }}
          new_version=$(echo $old_version | cut -d. -f1).$(($(echo $old_version | cut -d. -f2) + 1)).0
          mvn -B versions:set -DnewVersion=$new_version-SNAPSHOT -DgenerateBackupPoms=false
          git add .
          git commit -sm "[REL] :rocket: prepare next version"
          git push origin release-${{ github.event.inputs.version }}
